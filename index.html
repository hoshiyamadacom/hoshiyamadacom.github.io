<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オープンありがとうございます | 喫茶 ○○</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root { --brown:#5b3a29; --cream:#fff6e5; --accent:#c8793b; }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--cream); color:var(--brown);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    text-align:center;
  }
  header { padding:20px 16px 4px; }
  header small { letter-spacing:.3em; color:var(--accent); }
  header h1 { margin:6px 0 0; font-size:1.5rem; }
  model-viewer {
    width:100%; height:55vh; background:transparent; --poster-color:transparent;
  }
  .hotspot {
    background:#fff; border:2px solid var(--accent); border-radius:16px;
    padding:8px 12px; font-size:.85rem; color:var(--brown);
    box-shadow:0 4px 10px rgba(0,0,0,.15); white-space:nowrap;
  }
  .ar-btn {
    display:inline-block; margin:8px 0; padding:12px 28px;
    background:var(--accent); color:#fff; border:0; border-radius:999px;
    font-size:1rem; font-family:inherit;
  }
  .message {
    margin:12px 16px 24px; padding:20px; background:#fff;
    border-radius:16px; line-height:1.9; font-size:.98rem;
    box-shadow:0 4px 14px rgba(91,58,41,.12);
  }
  .info { font-size:.85rem; padding:0 16px 32px; line-height:1.8; }
</style>
</head>
<body>
<header>
  <small>GRAND OPEN</small>
  <h1>喫茶 ○○(お店の名前)</h1>
</header>

<!--
  3Dモデルの差し替え方:
  src の URL を、自分で用意した .glb ファイル(例: "animal.glb")に変更してください。
  下の馬はテスト用のサンプルです。
-->
<model-viewer
  src="https://modelviewer.dev/shared-assets/models/Horse.glb"
  alt="感謝を伝える3Dキャラクター"
  ar ar-modes="scene-viewer quick-look webxr"
  camera-controls auto-rotate
  shadow-intensity="1"
  autoplay>
  <button slot="ar-button" class="ar-btn">📱 ARでお店に呼ぶ</button>
  <div class="hotspot" slot="hotspot-thanks"
       data-position="0 1.6 0" data-normal="0 1 0">ありがとう!</div>
</model-viewer>

<div class="message">
  <p>ご来店いただき、<br>本当にありがとうございます。</p>
  <p>たくさんの方に支えていただき、<br>
  今日この日を迎えることができました。<br>
  ゆっくり、のんびり過ごせる場所になれば嬉しいです。</p>
  <p>どうぞ、また遊びにきてください。</p>
</div>

<div class="info">
  営業時間:○:○○〜○:○○ ／ 定休日:○曜日<br>
  住所:○○○○○○○○
</div>
</body>
</html>
